name: Sync Ludopedia + BGG → Supabase

# Daily at 09:00 UTC (= 06:00 BRT). Also triggered on demand:
#   - Manually from the Actions tab ("Run workflow")
#   - From the in-app "Sincronizar agora" button (POSTs to
#     /repos/.../actions/workflows/sync-ludopedia.yml/dispatches)
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

# A scheduled run + a manual click should never overlap.
concurrency:
  group: sync-ludopedia
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LUDOPEDIA_TOKEN: ${{ secrets.LUDOPEDIA_TOKEN }}
      BGG_AUTH_TOKEN: ${{ secrets.BGG_AUTH_TOKEN }}
      BGG_USERNAME: ${{ secrets.BGG_USERNAME }}
      BGG_PASSWORD: ${{ secrets.BGG_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Pull Ludopedia → data/preview-boardgames.json
        run: npm run enrich:boardgames

      - name: Pull BGG → data/preview-bgg.json
        run: npm run enrich:bgg

      - name: Upsert into Supabase
        run: npm run seed:supabase
